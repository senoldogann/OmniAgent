[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omniagent"
version = "0.1.0"
description = "Yerel macOS otomasyon ajanı: araç çağırma döngüsü, AX tabanlı GUI kontrolü, web ve kabuk araçları"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.17.0",
    "playwright>=1.63.0",
    "beautifulsoup4>=4.15.0",
    "pyautogui>=0.9.54",
    "pillow>=12.3.0",
    "opencv-python>=5.0.0.93",
    "numpy>=2.4.6",
    "ddgs>=9.16.0",
    "pyobjc-framework-ApplicationServices>=12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation>=12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-Speech>=12.2.2; sys_platform == 'darwin'",
    "customtkinter>=6.0.0",
    "mcp>=1.20,<2",
    "msal>=1.34,<2",
    "keyring>=25,<26",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "requests>=2.32,<3",
    "pyobjc-framework-vision>=12.2.2; sys_platform == 'darwin'",
]

[project.scripts]
omniagent = "omniagent.cli:main"
omniagent-ui = "omniagent.ui.app:main"
omniagent-telegram = "omniagent.integrations.telegram:main"
omniagent-benchmark = "omniagent.dev.benchmark:main"
omniagent-permissions = "omniagent.platform.macos.permissions:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/omniagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
